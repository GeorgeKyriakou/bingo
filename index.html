<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panos Bingo</title>
<meta name="theme-color" content="#0D3A2B">
<meta name="description" content="Bachelor party bingo. Tap a square when it happens.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch:#14503C;
    --pitch-deep:#0D3A2B;
    --chalk:#F3F6EE;
    --ink:#0D3A2B;
    --marker:#E0402B;
    --amber:#F5B92E;
    --rule:rgba(243,246,238,.30);
  }

  *{box-sizing:border-box;}

  html,body{margin:0;padding:0;}

  body{
    min-height:100dvh;
    background-color:var(--pitch-deep);
    background-image:repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.035) 0 44px,
      rgba(0,0,0,0) 44px 88px
    );
    color:var(--chalk);
    font-family:'Barlow Condensed','Oswald','Arial Narrow',system-ui,sans-serif;
    font-weight:500;
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
    display:flex;
    justify-content:center;
    padding:14px 10px calc(28px + env(safe-area-inset-bottom));
  }

  .page{width:100%;max-width:560px;}

  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    padding-bottom:8px;
    margin-bottom:12px;
    border-bottom:2px solid var(--rule);
  }

  h1{
    margin:0;
    font-size:clamp(1.5rem,6.4vw,2.3rem);
    font-weight:700;
    letter-spacing:.02em;
    line-height:.95;
    text-transform:uppercase;
  }

  .tally{
    font-size:clamp(.8rem,3.4vw,1rem);
    font-variant-numeric:tabular-nums;
    color:rgba(243,246,238,.72);
    white-space:nowrap;
  }

  .board{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:4px;
  }

  .cell{
    position:relative;
    aspect-ratio:1;
    margin:0;
    padding:5px 3px;
    border:0;
    border-radius:2px;
    background:var(--chalk);
    color:var(--ink);
    font:inherit;
    font-weight:600;
    font-size:clamp(.5rem,2.35vw,.9rem);
    line-height:1.08;
    text-align:center;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    overflow-wrap:break-word;
    hyphens:auto;
    cursor:pointer;
    transition:transform .12s ease, background-color .12s ease;
  }

  .cell:active{transform:scale(.95);}

  .cell:focus-visible{
    outline:3px solid var(--amber);
    outline-offset:2px;
    z-index:2;
  }

  .cell span{position:relative;z-index:2;}

  /* The stamp: two marker strokes crossing the square. */
  .cell.marked{background:#E9EEE2;}

  .cell.marked::before,
  .cell.marked::after{
    content:"";
    position:absolute;
    left:8%;
    right:8%;
    top:calc(50% - 2px);
    height:4px;
    border-radius:3px;
    background:var(--marker);
    opacity:.9;
    z-index:1;
  }
  .cell.marked::before{transform:rotate(41deg);}
  .cell.marked::after{transform:rotate(-38deg);}

  .reset:focus-visible{outline:3px solid var(--amber);outline-offset:2px;}

  .banner{
    position:fixed;
    inset:auto 0 0 0;
    background:var(--amber);
    color:var(--ink);
    padding:16px 18px calc(16px + env(safe-area-inset-bottom));
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    transform:translateY(105%);
    transition:transform .28s cubic-bezier(.2,.8,.3,1);
    z-index:10;
  }
  .banner.up{transform:translateY(0);}
  .banner p{margin:0;font-size:1.05rem;font-weight:600;}
  .banner strong{
    display:block;
    font-size:1.9rem;
    font-weight:700;
    line-height:1;
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .banner button{
    flex:none;
    border:2px solid var(--ink);
    border-radius:3px;
    background:transparent;
    color:var(--ink);
    font:inherit;
    font-weight:600;
    font-size:1rem;
    padding:7px 14px;
    cursor:pointer;

<body>
  <div class="page">
    <header>
      <h1 id="title">Panos Bingo</h1>
      <div class="tally" id="tally">0 of 24</div>
    </header>

    <div class="board" id="board" role="group" aria-label="Bingo card"></div>

    <div class="foot">
      <p class="hint">Tap a square when it happens. Five in a row and you shout.</p>
      <button class="reset" id="reset" type="button">Clear card</button>
    </div>
  </div>

  <div class="banner" id="banner" role="status">
    <p><strong>Bingo</strong>Shout it before someone else does.</p>
    <button type="button" id="dismiss">Keep playing</button>
  </div>

<script>
// ---- Edit these two lines -------------------------------------------------
const CARD_TITLE = "Panos Bingo";   // heading and browser tab
const FREE_TEXT  = "Free";          // label over the centre photo
// ---------------------------------------------------------------------------

const SQUARES = [
  "Talks about the wedding",
  "Photo with someone 60+",
  "Ends up shirtless",
  "Mentions buying protein or creatine",
  "Stranger buys him a drink",

  "Texts or calls Anna",
  "\u201CAI will take your job\u201D",
  "Talks about Elux",
  "Does a burpee",
  "Counts us in: 5, 6, 7, 8",

  "Loses his phone 10+ min",
  "Rants about bad coworkers",
  null,                              // free centre
  "Chickens out of a dare",
  "Shows off his fitness app",

  "Sings",
  "A shot with four of us",
  "\u201CI\u2019m still training tomorrow\u201D",
  "Tells a stranger he\u2019s marrying",
  "Takes off his shoe",

  "\u201CDancing is just cardio\u201D",
  "Sings badly in public",
  "Teaches us choreography",
  "\u201CI\u2019m not even that drunk\u201D",
  "A drink he cannot drink"
];

const FREE_INDEX = 12;
const STORAGE_KEY = "panos-bingo-v2";

const board   = document.getElementById("board");
const tally   = document.getElementById("tally");
const banner  = document.getElementById("banner");
const cells   = [];

let marked = new Set([FREE_INDEX]);
let announced = false;

// localStorage is blocked in some previews and private modes; the game still
// works without it, it just forgets on reload.
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) marked = new Set(JSON.parse(raw).concat([FREE_INDEX]));
  }catch(e){ /* no persistence available */ }
}
function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify([...marked]));
  }catch(e){ /* no persistence available */ }
}

function lines(){
  const out = [];
  for(let r=0;r<5;r++) out.push([0,1,2,3,4].map(c=>r*5+c));
  for(let c=0;c<5;c++) out.push([0,1,2,3,4].map(r=>r*5+c));
  out.push([0,6,12,18,24]);
  out.push([4,8,12,16,20]);
  return out;
}
const LINES = lines();

function build(){
  document.getElementById("title").textContent = CARD_TITLE;
  document.title = CARD_TITLE;

  SQUARES.forEach((text,i)=>{
    const b = document.createElement("button");
    b.type = "button";
    b.className = "cell" + (i===FREE_INDEX ? " free" : "");
    b.innerHTML = "<span></span>";
    b.querySelector("span").textContent = (i===FREE_INDEX ? FREE_TEXT : text);

    if(i===FREE_INDEX){
      b.disabled = true;
      b.setAttribute("aria-label","Free square, already marked");
    }else{
      b.addEventListener("click",()=>toggle(i));
    }
    board.appendChild(b);
    cells.push(b);
  });
}

function toggle(i){
  marked.has(i) ? marked.delete(i) : marked.add(i);
  save();
  render();
}

function render(){
  const winning = new Set();
  LINES.forEach(line=>{
    if(line.every(i=>marked.has(i))) line.forEach(i=>winning.add(i));
  });

  cells.forEach((cell,i)=>{
    const on = marked.has(i);
    cell.classList.toggle("marked", on && i!==FREE_INDEX);
    cell.classList.toggle("win", winning.has(i));
    if(i!==FREE_INDEX) cell.setAttribute("aria-pressed", String(on));
  });

  const count = [...marked].filter(i=>i!==FREE_INDEX).length;
  tally.textContent = count + " of 24";

  if(winning.size && !announced){
    announced = true;
    banner.classList.add("up");
  }else if(!winning.size){
    announced = false;
    banner.classList.remove("up");
  }
}

const resetBtn = document.getElementById("reset");
let armed = false, armTimer = null;

function disarm(){
  armed = false;
  clearTimeout(armTimer);
  resetBtn.classList.remove("armed");
  resetBtn.textContent = "Clear card";
}

resetBtn.addEventListener("click",()=>{
  if(!armed){                       // first tap arms it, second tap clears
    armed = true;
    resetBtn.classList.add("armed");
    resetBtn.textContent = "Tap again";
    armTimer = setTimeout(disarm, 3000);
    return;
  }
  disarm();
  marked = new Set([FREE_INDEX]);
  announced = false;
  banner.classList.remove("up");
  save();
  render();
});

document.getElementById("dismiss").addEventListener("click",()=>{
  banner.classList.remove("up");
});

load();
build();
render();
</script>
</body>
</html>
